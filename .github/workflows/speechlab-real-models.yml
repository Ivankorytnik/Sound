name: Speech Lab REAL model preflight (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Load and run real Whisper and English to Russian models
        run: python live_model_real_test.py
      - name: Real end-to-end EN speech -> Whisper -> OPUS-MT -> RU (synthetic fixture)
        run: python live_model_e2e_real_test.py
      - name: Real worker with CDN and Hugging Face blocked
        run: python live_model_offline_test.py
      - name: Speech-only mode with real Whisper, Silero VAD and OPUS-MT
        run: python live_speech_only_real_test.py
