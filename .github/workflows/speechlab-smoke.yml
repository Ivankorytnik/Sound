name: Speech Lab browser smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app-core.js
          node --check app.js
          node --check folder-save.js
          node --check compact.js
          node --check transcription-engine.js
          node --check transcription-runtime.js
          node --check transcription-worker.js
          node --check video.js
          node --check video-source.js
          node --check video-ffmpeg-worker.js
      - name: Install browser and Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Install FFmpeg for integration fixture
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Browser smoke test
        run: |
          node video_source_test.cjs
          python smoke_test.py
          python video_smoke_test.py
          python video_e2e_test.py
          python video_url_test.py
      - name: Meeting folder and transcript saving
        run: python meeting_folders_test.py
      - name: Compact layout and editing regression
        run: python compact_smoke_test.py
      - name: Save requested screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speechlab-compact-screenshots
          path: screenshots/
